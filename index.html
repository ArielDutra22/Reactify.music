<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactify — Universo Musical</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="universo"></canvas>

    <main class="interface">
        <header>
            <h1>Reactify<span>.</span></h1>
            <p>Um universo criado pelo som.</p>
        </header>

        <section class="controles">
            <button id="conectar">Conectar Spotify</button>
            <p id="status">Aguardando conexão com o Spotify</p>
        </section>

        <div class="rodape">
            <span>LIVE AUDIO</span>
            <span id="frequencia">0 Hz</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
